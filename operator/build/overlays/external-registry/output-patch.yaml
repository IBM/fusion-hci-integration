# output-patch.yaml — generated by `make apply-buildconfigs`
# Do not edit by hand; values come from build/config.env (REGISTRY_PUSH, REGISTRY_PUSH_SECRET, IMAGE_TAG).
# This file is in .gitignore — it is environment-specific.
- op: replace
  path: /spec/output
  value:
    to:
      kind: DockerImage
      name: REGISTRY_PUSH_PLACEHOLDER/IMAGE_NAME_PLACEHOLDER:IMAGE_TAG_PLACEHOLDER
    pushSecret:
      name: PUSH_SECRET_PLACEHOLDER
