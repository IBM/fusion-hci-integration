apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hci-node-manager

resources:
  - imagestream.yaml
  - rbac.yaml
  - deployment-consumer.yaml
  - deployment-provisioner.yaml
  # CRDs are installed separately via: make install
  # They are cluster-scoped and cannot be path-referenced from here due to
  # kustomize's security model (no ../ traversal allowed).
