---
# deploy/base/deployment-consumer.yaml
#
# Runs three containers in one pod:
#   operator      — ansible-operator watch loop (WorkerPool reconcile)
#   csr-approver  — node-auto-approver.py (watch + approve CSRs)
#   node-labeler  — node-labeler.py (watch + label nodes by IP)
#
# All three share the same image (hci-consumer-operator).
# Image reference is overridden by the kustomize overlay images: patch.
# Environment variables for sidecars must be configured per deployment —
# override via a kustomize patch in your overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hci-consumer-operator
  namespace: hci-node-manager
  labels:
    app.kubernetes.io/name: hci-consumer-operator
    app.kubernetes.io/part-of: hci-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hci-consumer-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hci-consumer-operator
        app.kubernetes.io/part-of: hci-integration
    spec:
      serviceAccountName: hci-consumer-operator
      # Run on control-plane nodes (s390x) — worker nodes may not be present
      # at startup and are of the wrong architecture.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets: []   # populated by make deploy when REGISTRY_PUSH_SECRET is set
      containers:
        # ── Ansible operator (WorkerPool reconcile loop) ──────────────────────
        - name: operator
          image: hci-consumer-operator:latest   # overridden by overlay images: patch
          imagePullPolicy: Always
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: hci-consumer-operator
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # ── CSR auto-approver sidecar ─────────────────────────────────────────
        - name: csr-approver
          image: hci-consumer-operator:latest   # same image, different command
          imagePullPolicy: Always
          command: ["python3", "/opt/node-manager/node-auto-approver.py"]
          env: []
          # NODE_NAME_PATTERN is written by the operator into hci-node-manager-config
          # ConfigMap on every reconcile — sourced from spec.consumer.workers.namePrefix
          envFrom:
            - configMapRef:
                name: hci-node-manager-config
                optional: true   # pod starts even if CM not yet created on first boot
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # ── Node labeler sidecar ──────────────────────────────────────────────
        - name: node-labeler
          image: hci-consumer-operator:latest   # same image, different command
          imagePullPolicy: Always
          command: ["python3", "/opt/node-manager/node-labeler.py"]
          env:
            # TARGET_LABEL is fixed — all HCI worker nodes get this role label
            - name: TARGET_LABEL
              value: "node-role.kubernetes.io/hci-vm"
          # TARGET_NETWORK is written by the operator into hci-node-manager-config
          # ConfigMap on every reconcile — sourced from spec.provider.networking.internalSubnet
          envFrom:
            - configMapRef:
                name: hci-node-manager-config
                optional: true   # pod starts even if CM not yet created on first boot
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
