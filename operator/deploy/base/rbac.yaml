---
# deploy/base/rbac.yaml
# ServiceAccounts, ClusterRoles, and ClusterRoleBindings for both operators.
# Sourced from operator/hci-consumer/config/rbac/role.yaml and
# operator/hci-provisioner/config/rbac/role.yaml — kept in sync manually.

# ── hci-consumer ServiceAccount ───────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hci-consumer-operator
  namespace: hci-node-manager
  labels:
    app.kubernetes.io/name: hci-consumer-operator
    app.kubernetes.io/part-of: hci-integration
---
# ── hci-provisioner ServiceAccount ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hci-provisioner-operator
  namespace: hci-node-manager
  labels:
    app.kubernetes.io/name: hci-provisioner-operator
    app.kubernetes.io/part-of: hci-integration
---
# ── hci-consumer ClusterRole ──────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hci-consumer-operator
  labels:
    app.kubernetes.io/name: hci-consumer-operator
    app.kubernetes.io/part-of: hci-integration
rules:
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpools"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpools/finalizers"]
    verbs: ["update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpoolprovisionings"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpoolprovisionings/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ConfigMap write — operator writes hci-node-manager-config for sidecars
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read ClusterVersion (BS-06b bootfiles gate) + DNS config (csr-approver domain lookup)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "dnses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames:
      - "kubernetes.io/kube-apiserver-client-kubelet"
      - "kubernetes.io/kubelet-serving"
    verbs: ["approve"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # MachineConfigPool + MachineConfig: create-if-absent (BS-02b), read for health check
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigpools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hci-consumer-operator
  labels:
    app.kubernetes.io/name: hci-consumer-operator
    app.kubernetes.io/part-of: hci-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hci-consumer-operator
subjects:
  - kind: ServiceAccount
    name: hci-consumer-operator
    namespace: hci-node-manager
---
# ── hci-provisioner ClusterRole ───────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hci-provisioner-operator
  labels:
    app.kubernetes.io/name: hci-provisioner-operator
    app.kubernetes.io/part-of: hci-integration
rules:
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpoolprovisionings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpoolprovisionings/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpoolprovisionings/finalizers"]
    verbs: ["update"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hci-integration.openshift.io"]
    resources: ["workerpools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions", "dnses", "infrastructures"]
    verbs: ["get", "list", "watch"]
  # MachineConfig read-only — BS-04: read 99-worker-ssh SSH key for gateway cloud-init
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hci-provisioner-operator
  labels:
    app.kubernetes.io/name: hci-provisioner-operator
    app.kubernetes.io/part-of: hci-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hci-provisioner-operator
subjects:
  - kind: ServiceAccount
    name: hci-provisioner-operator
    namespace: hci-node-manager
