---
# deploy/base/deployment-provisioner.yaml
#
# Runs the hci-provisioner ansible-operator watch loop.
# Watches WorkerPoolProvisioning CRs and drives bootstrap/teardown steps.
#
# Image reference is overridden by the kustomize overlay images: patch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hci-provisioner-operator
  namespace: hci-node-manager
  labels:
    app.kubernetes.io/name: hci-provisioner-operator
    app.kubernetes.io/part-of: hci-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hci-provisioner-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hci-provisioner-operator
        app.kubernetes.io/part-of: hci-integration
    spec:
      serviceAccountName: hci-provisioner-operator
      # Run on control-plane nodes (s390x)
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets: []   # populated by make deploy when REGISTRY_PUSH_SECRET is set
      containers:
        - name: operator
          image: hci-provisioner-operator:latest   # overridden by overlay images: patch
          imagePullPolicy: Always
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: hci-provisioner-operator
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
